name: Lint

on:
    - push
    - pull_request

defaults:
    run:
        shell: bash

jobs:
    lint:
        runs-on: ubuntu-26.04
        steps:
            - uses: actions/checkout@v5
            - uses: astral-sh/setup-uv@v7
              with:
                  cache-suffix: lint
            - name: Resolve latest dependency versions (uv.lock is not committed)
              run: uv lock
            - name: Run ruff and pylint as defined in noxfile.py
              run: uv run nox --session lint
