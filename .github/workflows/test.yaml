name: Test

on:
    - push
    - pull_request

defaults:
    run:
        shell: bash

jobs:
    pytest:
        strategy:
            fail-fast: true
            matrix:
                os:
                    - ubuntu-26.04
                    - windows-latest
                # Keep in sync with PYTHON_VERSIONS in noxfile.py.
                python-version:
                    - "3.9"
                    - "3.10"
                    - "3.11"
                    - "3.12"
                    - "3.13"
                    - "3.14"
                    - "3.15"
                    - "pypy-3.10"
                    - "pypy-3.11"
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v5
            - uses: astral-sh/setup-uv@v7
            - name: Resolve latest dependency versions (uv.lock is not committed)
              run: uv lock
            - name: Run tests as defined in noxfile.py
              run: uv run nox --session "test-${{ matrix.python-version }}"
